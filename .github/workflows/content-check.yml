name: Validate website and articles
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  SITE_URL: ${{ vars.SITE_URL }}
concurrency:
  group: website-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:astro
      - run: npm run build
      - run: npm run check:discovery
      - run: npm run notify:indexnow -- --dry-run
  notify-search:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Wait for the production deploy and notify participating search engines
        run: npm run notify:indexnow
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
